<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — SURAKSHA</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background-color: var(--slate-100);">

  <header class="navbar">
    <div class="container">
      <a href="/" class="nav-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">सुरक्षा</span>
          <span class="brand-tagline">CITIZEN SAFETY PLATFORM</span>
        </div>
      </a>
      <div class="nav-actions">
        <button class="btn-sos-header btn-sos-trigger" id="header-sos-btn">
          <span class="pulse-dot"></span>
          <span>SOS</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 440px;">
      
      <div class="card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 24px;">
          <h1 style="font-size: 24px; font-weight: 800; color: var(--navy-900); margin-bottom: 6px;">Welcome Back</h1>
          <p style="font-size: 14px; color: var(--slate-500);">Log in to track your safety reports and stay informed.</p>
        </div>

        <div style="background-color: var(--info-blue-light); border: 1px solid #93C5FD; border-radius: var(--radius-md); padding: 12px; margin-bottom: 20px;">
          <div style="font-size: 11px; font-weight: 700; color: var(--info-blue); text-transform: uppercase; margin-bottom: 6px;">
            ⚡ Quick Login Fill
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 12px;" onclick="Auth.fillDemo('citizen')">
              Citizen Login
            </button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 12px;" onclick="Auth.fillDemo('authority')">
              Officer Login
            </button>
          </div>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="username">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="btn-login-submit" style="width: 100%; margin-top: 8px;">
            Log In to SURAKSHA
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--slate-500);">
          Don't have an account? <a href="/register.html" style="font-weight: 600;">Sign up here</a>
        </div>

        <div style="text-align: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--slate-200); font-size: 12px;">
          Police or Authority official? <a href="/authority/login.html" style="font-weight: 700; color: var(--navy-900);">Command Portal →</a>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/sos.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('btn-login-submit');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Verifying credentials...';

      try {
        const res = await ApiClient.auth.login(email, password);
        ApiClient.setToken(res.access_token);
        ApiClient.setUser(res.user);

        App.showToast(`Welcome, ${res.user.full_name}!`, 'success');

        setTimeout(() => {
          if (res.user.role === 'authority') {
            window.location.href = '/authority/dashboard.html';
          } else {
            const urlParams = new URLSearchParams(window.location.search);
            window.location.href = urlParams.get('redirect') || '/dashboard.html';
          }
        }, 600);
      } catch (err) {
        App.showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Log In to SURAKSHA';
      }
    });
  </script>
</body>
</html>
